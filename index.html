  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50: '#F0F5FA', 100: '#E1EBF5', 600: '#2B6CB0', 700: '#1F497D', 800: '#16365C', 900: '#0F243E' }, eco: { 600: '#276749', 700: '#22543D' } }

      }

      <!-- Logo -->

        <svg class="w-10 h-10 sm:w-12 sm:h-12 drop-shadow-md" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

              </div>
            </div>
          </div>
        </div>

        <button onclick="toggleLanguage()" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold border border-white/20 transition-all ml-2">

  <!-- 2. ADMIN PANEL STRIP -->

      <div class="flex items-center space-x-2 text-red-800 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

      </div>

        <span>新增牌號資料</span>
      </button>
    </div>
  </section>

  <!-- 3. MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full relative">
    <div id="mainContent" class="transition-opacity duration-500">
      
      <!-- Filters & Search -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 custom-shadow border border-slate-200/80 mb-6">
        <div class="flex flex-col lg:flex-row gap-3 items-center justify-between">
          <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋品牌 (DOW, Exxon, Keltan, Mitsui...) 或牌號..." class="w-full lg:w-96 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
          
          <div class="flex flex-wrap gap-2 text-xs items-center">
            <button onclick="setCat('ALL')" class="cat-btn px-3 py-1.5 rounded-lg bg-brand-700 text-white font-bold" data-c="ALL">全部</button>
            <button onclick="setCat('DOW')" class="cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200" data-c="DOW">DOW (Nordel)</button>
            <button onclick="setCat('EXXON')" class="cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200" data-c="EXXON">ExxonMobil (Vistalon)</button>
            <button onclick="setCat('ARLANXEO')" class="cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200" data-c="ARLANXEO">ARLANXEO (Keltan)</button>
            <button onclick="setCat('MITSUI')" class="cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200" data-c="MITSUI">Mitsui EPT</button>

          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl custom-shadow border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-700">
            <thead class="bg-slate-100 font-bold border-b border-slate-200">
              <tr>
                <th class="py-3 px-4">品牌系列</th>
                <th class="py-3 px-4">牌號 (Grade)</th>
                <th class="py-3 px-4">門尼黏度 (Mooney)</th>
                <th class="py-3 px-4">乙烯含量 / 特性</th>
                <th class="py-3 px-4 text-center">技術規格與操作</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100">
              <!-- JS Injected -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== 4. ADMIN MODAL ==================== -->

        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white bg-slate-700 p-1.5 rounded-full">✕</button>
      </div>
      <div class="p-6 space-y-4 text-sm">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-1">產品代碼 (ID)</label>
            <input type="text" id="upId" placeholder="ex: dow-4725p" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block font-bold mb-1">分類</label>
            <select id="upCat" class="w-full px-3 py-2 border rounded-lg">
              <option value="DOW">DOW</option>
              <option value="EXXON">ExxonMobil</option>
              <option value="ARLANXEO">ARLANXEO</option>
              <option value="MITSUI">Mitsui</option>
              <option value="KUMHO_SK">Kumho / SK</option>
              <option value="LION_LVE">LION / LVE</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-1">品牌名稱</label>
            <input type="text" id="upBrand" placeholder="DOW (陶氏)" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block font-bold mb-1">牌號 (Grade)</label>
            <input type="text" id="upGrade" placeholder="Nordel 4725P" class="w-full px-3 py-2 border rounded-lg">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-1">門尼黏度</label>
            <input type="text" id="upMooney" placeholder="ML(1+4): 25" class="w-full px-3 py-2 border rounded-lg">
          </div>
          <div>
            <label class="block font-bold mb-1">乙烯含量/特性</label>
            <input type="text" id="upEth" placeholder="乙烯 68wt%" class="w-full px-3 py-2 border rounded-lg">
          </div>
        </div>
        <div>
          <label class="block font-bold mb-1">詳細說明</label>
          <textarea id="upDesc" rows="3" class="w-full px-3 py-2 border rounded-lg" placeholder="特性說明..."></textarea>
        </div>
        <button onclick="submitProductData()" class="w-full py-3 bg-brand-600 text-white rounded-xl font-bold">確認儲存</button>
      </div>
    </div>
  </div>

      { id: 'kumho-kes370', category: 'KUMHO_SK', brand: 'Kumho Polychem (韓國錦湖)', grade: 'KEP-370', mooney: '45 (ML 1+4, 125°C)', eth: '58 wt% / ENB 4.5%', descZh: '綜合性能平衡之通用級別，廣泛用於各類工業橡膠配件。' },
      { id: 'sk-kep270', category: 'KUMHO_SK', brand: 'SK geo centric (韓國SK)', grade: 'KEP-270', mooney: '68 (ML 1+4, 125°C)', eth: '57 wt% / ENB 9.5%', descZh: '超高ENB含量，過氧化物與硫黃硫化速度極快。' },
      { id: 'lion-epdm-1', category: 'LION_LVE', brand: 'LION (萊昂化學)', grade: 'Lion EPDM L-10', mooney: '55 (ML 1+4, 125°C)', eth: '62 wt% / 特規', descZh: '日系高品質特種EPDM，針對耐化學品與高抗撕裂強度設計。' },
      { id: 'lve-epdm-sp', category: 'LION_LVE', brand: 'LVE (聯盟特規)', grade: 'LVE-EPDM 540', mooney: '48 (ML 1+4, 125°C)', eth: '64 wt% / ENB 5.0%', descZh: '高效能合成 EPDM，具備優異的混煉均勻性與表面光澤度。' }
    ];

    const ADMIN_EMAILS = ['marswu@example.com', 'ianteai.com@gmail.com', 'boss@ianteai.com'];

    function loginWithGooglePopup() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("登入失敗: " + err.message));
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
      isAdmin = user && ADMIN_EMAILS.includes(user.email);
      document.getElementById('btnLogin').classList.toggle('hidden', !!user);
      document.getElementById('userProfile').classList.toggle('hidden', !user);
      document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
      if (user) document.getElementById('userName').innerText = user.displayName || 'Admin';
      renderTable();
    });

    // 自動初始化資料庫
    function loadProductsFromDB() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(async snapshot => {
        PRODUCTS = [];
        snapshot.forEach(doc => PRODUCTS.push({ id: doc.id, ...doc.data() }));

        if (PRODUCTS.length === 0) {
          for (let p of DEFAULT_EPDM_PRODUCTS) {
            await db.collection('products').doc(p.id).set({
              ...p,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } else {
          renderTable();
        }
      });
    }

    loadProductsFromDB();

    function showInfo(desc, grade, brand) {
      alert(`【${brand} - ${grade}】\n\n特性說明：${desc}`);
    }

    function handleDelete(id) {
      if (!isAdmin) return;
      if (confirm('確定要刪除這筆資料嗎？')) {
        db.collection('products').doc(id).delete().then(() => alert('已刪除'));
      }
    }

    function setCat(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = (btn.dataset.c === cat) ? "cat-btn px-3 py-1.5 rounded-lg bg-brand-700 text-white font-bold shadow" : "cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200";
      });
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const tbody = document.getElementById('tableBody');
      
      const filtered = PRODUCTS.filter(p => {
        if (currentCategory !== 'ALL' && p.category !== currentCategory) return false;
        if (q && !p.brand.toLowerCase().includes(q) && !p.grade.toLowerCase().includes(q) && !p.id.toLowerCase().includes(q) && !(p.descZh || '').toLowerCase().includes(q)) return false;
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">尚無相符的 EPDM 牌號資料（請點擊上方「全部」檢查）</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const adminBtns = isAdmin ? `
          <button onclick="openModalForEdit('${p.id}', '${p.category}', '${p.brand}', '${p.grade}', '${p.mooney || ''}', '${p.eth || ''}', '${(p.descZh || '').replace(/'/g, "\\'")}')" class="px-2 py-1 bg-amber-50 text-amber-600 rounded text-xs hover:bg-amber-100 border border-amber-200">修改</button>
          <button onclick="handleDelete('${p.id}')" class="px-2 py-1 bg-red-50 text-red-600 rounded text-xs hover:bg-red-100 border border-red-200">刪除</button>
        ` : '';

        return `
          <tr class="hover:bg-brand-50/50 transition-colors border-b border-slate-50">
            <td class="py-4 px-4 font-semibold text-slate-700">${p.brand}</td>
            <td class="py-4 px-4 font-mono text-sm text-brand-900 font-extrabold">${p.grade}</td>
            <td class="py-4 px-4 text-slate-700 font-mono text-xs">${p.mooney || '-'}</td>
            <td class="py-4 px-4 text-slate-600 text-xs">${p.eth || '-'}</td>
            <td class="py-4 px-4 text-center">
              <div class="flex justify-center items-center space-x-2">
                <button onclick="showInfo('${(p.descZh || '').replace(/'/g, "\\'")}', '${p.grade}', '${p.brand}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-brand-50 text-brand-700 border border-brand-200 hover:bg-brand-100">查看規格</button>
                ${adminBtns}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openModalForAdd() {
      if (!isAdmin) return;
      isEditing = false;
      document.getElementById('modalAdminTitle').innerText = "新增牌號資料";
      document.getElementById('upId').value = '';
      document.getElementById('upId').disabled = false;
      document.getElementById('upBrand').value = '';
      document.getElementById('upGrade').value = '';
      document.getElementById('upMooney').value = '';
      document.getElementById('upEth').value = '';
      document.getElementById('upDesc').value = '';
      document.getElementById('adminModal').classList.remove('hidden');
    }

    function openModalForEdit(id, category, brand, grade, mooney, eth, desc) {
      if (!isAdmin) return;
      isEditing = true;
      document.getElementById('modalAdminTitle').innerText = "修改牌號資料";
      document.getElementById('upId').value = id;
      document.getElementById('upId').disabled = true;
      document.getElementById('upCat').value = category;
      document.getElementById('upBrand').value = brand;
      document.getElementById('upGrade').value = grade;
      document.getElementById('upMooney').value = mooney;
      document.getElementById('upEth').value = eth;
      document.getElementById('upDesc').value = desc;
      document.getElementById('adminModal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    async function submitProductData() {
      if (!isAdmin) return;
      const id = document.getElementById('upId').value.trim();
      const brand = document.getElementById('upBrand').value.trim();
      const grade = document.getElementById('upGrade').value.trim();
      
      if (!id || !brand || !grade) {
        alert('請填寫完整資訊！');
        return;
      }

      try {
        const payload = {
          category: document.getElementById('upCat').value,
          brand: brand,
          grade: grade,
          mooney: document.getElementById('upMooney').value.trim(),
          eth: document.getElementById('upEth').value.trim(),
          descZh: document.getElementById('upDesc').value.trim() || '標準規格',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (isEditing) delete payload.createdAt;

        await db.collection('products').doc(id).set(payload, { merge: true });
        alert('儲存成功！');
        closeAdminModal();
      } catch (err) {
        alert('儲存失敗: ' + err.message);
      }
    }
  </script>
</body>
</html>
