<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>火星人的地球便當 · 全球即時監控 & 財經導航旗艦站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0b0f17;
      --bg-sidebar: #111827;
      --bg-header: #131b2c;
      --bg-card: #162032;
      --bg-card-hover: #1e2c44;
      --border: #223048;
      --border-highlight: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.35);
      --green: #10b981;
      --purple: #a855f7;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部固定狀態列 */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      white-space: nowrap;
    }
    .top-right-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 右上角精選新聞導流區與下拉選單 */
    .top-featured-articles-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .top-share-dropdown-btn {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #fbbf24;
      border-radius: 14px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .top-share-dropdown-btn:hover {
      background: #f59e0b;
      color: #0b0f17;
    }
    .top-share-admin-btn {
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      border-radius: 14px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 700;
      white-space: nowrap;
    }
    .top-share-admin-btn:hover {
      background: #38bdf8;
      color: #0b0f17;
    }
    .top-articles-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 360px;
      max-width: 92vw;
      background: #131b2c;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 12px;
    }
    .top-articles-dropdown.show { display: block; }
    .top-articles-dropdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #223048;
      font-size: 12.5px;
      font-weight: 700;
      color: #f59e0b;
    }
    .top-articles-dropdown-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .top-article-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #162032;
      border: 1px solid #223048;
      border-radius: 6px;
      padding: 8px 10px;
      text-decoration: none;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.4;
      transition: all 0.15s ease;
    }
    .top-article-item:hover {
      background: #1e2c44;
      border-color: #f59e0b;
      color: #fef08a;
    }
    .article-date-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 右上角強推分享連結 */
    .top-share-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25) 0%, rgba(217, 119, 6, 0.35) 100%);
      border: 1px solid #f59e0b;
      color: #fef08a;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .top-share-link:hover {
      background: #f59e0b;
      color: #0b0f17;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
      transform: translateY(-1px);
    }

    .clocks-wrap {
      display: flex;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: #0b0f17;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .clock-item { display: flex; align-items: center; gap: 5px; }
    .clock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

      align-items: center;
      gap: 5px;

      padding-left:
