<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>彥泰企業 IANTEAI - 國際 EPDM 與合成橡膠技術資料庫</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50: '#F0F5FA', 100: '#E1EBF5', 600: '#2B6CB0', 700: '#1F497D', 800: '#16365C', 900: '#0F243E' }, eco: { 600: '#276749', 700: '#22543D' } }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    .glass-nav { background: rgba(31, 73, 125, 0.96); backdrop-filter: blur(10px); }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(15, 36, 62, 0.08), 0 2px 6px -1px rgba(15, 36, 62, 0.04); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased pb-20 md:pb-6">

  <!-- 1. HEADER & AUTH -->
  <header class="glass-nav text-white sticky top-0 z-40 border-b border-brand-800 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center justify-between py-2 sm:py-0 sm:h-20 gap-2">
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <svg class="w-10 h-10 sm:w-12 sm:h-12 drop-shadow-md" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="#1F497D" stroke="#38BDF8" stroke-width="3"/>
          <text x="50" y="58" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">TIT</text>
        </svg>
        <div>
          <h1 class="text-base sm:text-xl font-bold tracking-tight text-white flex items-center space-x-2">
            <span>彥泰企業 IANTEAI</span>
            <span id="brandTag" class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 hidden md:inline">全系統橡膠與 EPDM 專家資料庫</span>
          </h1>
        </div>
      </div>

      <!-- Navigation / Cost Calculator Link & Auth -->
      <div class="flex items-center space-x-3 text-sm">
        <a href="https://ianteaicom-rgb.github.io/tds/power" target="_blank" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold transition-all text-xs shadow-md" title="EPDM 生產配方、真實成本與業務銷售定價系統">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          <span id="txtCalcLink">配方與成本定價系統</span>
        </a>

        <div id="authContainer" class="flex items-center bg-brand-900/50 rounded-lg p-1.5 border border-brand-700">
          <div id="authLoading" class="px-2 text-xs text-brand-300 animate-pulse hidden">Loading...</div>
          
          <button id="btnLogin" onclick="loginWithGooglePopup()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-md bg-white text-slate-800 font-semibold hover:bg-slate-100 transition-colors text-xs shadow-sm">
            <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            <span id="txtLoginBtn">管理員登入</span>
          </button>

          <div id="userProfile" class="hidden flex items-center space-x-2.5 px-2">
            <img id="userAvatar" src="" class="w-7 h-7 rounded-full border border-brand-500">
            <div class="flex flex-col">
              <div class="flex items-center space-x-1.5">
                <span id="userName" class="font-bold text-[13px] truncate max-w-[90px]">Admin</span>
                <span class="bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">Admin</span>
              </div>
              <div class="flex items-center space-x-2 text-[11px] text-sky-200">
                <button onclick="logout()" id="txtLogoutBtn" class="hover:text-white underline">登出系統</button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Language Selector Dropdown -->
        <div class="relative ml-2">
          <select id="langSelect" onchange="changeLanguage(this.value)" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold border border-white/20 transition-all focus:outline-none cursor-pointer">
            <option value="zh" class="bg-slate-800 text-white">繁體中文</option>
            <option value="en" class="bg-slate-800 text-white">English</option>
            <option value="vi" class="bg-slate-800 text-white">Tiếng Việt</option>
            <option value="id" class="bg-slate-800 text-white">Bahasa Indonesia</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- 2. ADMIN PANEL STRIP -->
  <section id="adminPanel" class="hidden bg-red-50 border-b border-red-200 py-3 shadow-inner">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3 text-sm">
      <div class="flex items-center space-x-2 text-red-800 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span id="txtAdminTitle">總管理員控制台</span>
      </div>
      <button onclick="openModalForAdd()" class="px-4 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold shadow hover:bg-red-700 transition-colors flex items-center space-x-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        <span id="txtAdminBtn">新增橡膠產品資料</span>
      </button>
    </div>
  </section>

  <!-- 3. MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full relative">
    <div id="mainContent" class="transition-opacity duration-500">
      
      <!-- Search & Category Filters -->
      <div class="bg-white rounded-2xl p-4 sm:p-6 custom-shadow border border-slate-200/80 mb-6 space-y-4">
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
          <!-- 智慧即時搜索框 -->
          <div class="relative w-full md:w-[360px]">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="快速搜索：品牌、牌號、乙烯、含油率..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
          </div>
          
          <!-- 膠種大分類快速按鈕 -->
          <div class="flex flex-wrap gap-2 text-xs items-center justify-end w-full md:w-auto">
            <button onclick="setCat('ALL')" class="cat-btn px-3.5 py-2 rounded-xl bg-brand-700 text-white font-bold shadow-sm transition-all" data-c="ALL" id="catAll">全部</button>
            <button onclick="setCat('EPDM_INT')" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium" data-c="EPDM_INT" id="catEpdmInt">🌍 國際大廠 EPDM</button>
            <button onclick="setCat('REPRO')" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium" data-c="REPRO" id="catRepro">♻️ 彥泰環保再製膠</button>
            <button onclick="setCat('SYNTHETIC')" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium" data-c="SYNTHETIC" id="catSynthetic">🧪 合成橡膠 (BR/SBR/NBR)</button>
          </div>
        </div>

        <!-- 🛠️ 進階篩選面板 -->
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/70 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
          <!-- 1. 型態篩選 -->
          <div>
            <label class="block font-bold text-slate-600 mb-1" id="lblFormFilter">橡膠型態 (Form)</label>
            <select id="filterForm" onchange="renderTable()" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-1 focus:ring-brand-500">
              <option value="ALL">全部型態 (All Forms)</option>
              <option value="顆粒">顆粒 (Pellets)</option>
              <option value="塊膠">塊膠 (Bale)</option>
              <option value="粉體">粉體 (Powder)</option>
              <option value="液態">液態 (Liquid)</option>
            </select>
          </div>

          <!-- 2. 門尼黏度區間 -->
          <div>
            <label class="block font-bold text-slate-600 mb-1" id="lblMooneyFilter">門尼黏度篩選 (Mooney)</label>
            <select id="filterMooney" onchange="renderTable()" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-1 focus:ring-brand-500">
              <option value="ALL">全部門尼範圍 (All)</option>
              <option value="LOW">低門尼 (&lt; 35)</option>
              <option value="MID">中門尼 (35 - 60)</option>
              <option value="HIGH">高門尼 (&gt; 60)</option>
            </select>
          </div>

          <!-- 3. ENB 第三單體區間 -->
          <div>
            <label class="block font-bold text-slate-600 mb-1" id="lblEnbFilter">ENB 第三單體篩選</label>
            <select id="filterEnb" onchange="renderTable()" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-1 focus:ring-brand-500">
              <option value="ALL">全部 ENB 範圍 (All)</option>
              <option value="LOW">低 ENB (&lt; 2%) - 良好過氧化物硫化</option>
              <option value="MID">中 ENB (2% - 6%) - 通用型</option>
              <option value="HIGH">高 ENB (&gt; 6%) - 高硫化速度</option>
            </select>
          </div>

          <!-- 4. 重置條件 -->
          <div class="flex items-end">
            <button onclick="resetAdvancedFilters()" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg transition-colors flex items-center justify-center space-x-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span>重置進階條件</span>
            </button>
          </div>
        </div>
        <!-- Sub-brand filter buttons -->
        <div id="subFilterBar" class="flex flex-wrap gap-1.5 pt-2 border-t border-slate-100 text-xs">
          <span class="text-slate-400 self-center mr-1 font-semibold" id="lblBrandFilter">品牌快速篩選：</span>
          <button onclick="setSubBrand('ALL')" class="sub-btn px-2.5 py-1 rounded-md bg-brand-600 text-white font-bold" data-b="ALL" id="subAll">全部品牌</button>
          <button onclick="setSubBrand('DOW')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="DOW">DOW</button>
          <button onclick="setSubBrand('EXXON')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="EXXON">ExxonMobil</button>
          <button onclick="setSubBrand('ARLANXEO')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="ARLANXEO">ARLANXEO</button>
          <button onclick="setSubBrand('MITSUI')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="MITSUI">Mitsui</button>
          <button onclick="setSubBrand('KUMHO')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="KUMHO">Kumho</button>
          <button onclick="setSubBrand('SK')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="SK">SK</button>
          <button onclick="setSubBrand('LION')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="LION">LION</button>
          <button onclick="setSubBrand('LVE')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="LVE">LVE</button>
          <button onclick="setSubBrand('CHINA')" class="sub-btn px-2.5 py-1 rounded-md bg-orange-100 text-orange-800 hover:bg-orange-200 font-bold" data-b="CHINA">🇨🇳 中國品牌 (吉化/燕山等)</button>
          <button onclick="setSubBrand('IANTEAI')" class="sub-btn px-2.5 py-1 rounded-md bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-bold" data-b="IANTEAI" id="subIanteai">⭐ 彥泰精煉專區</button>
        </div>
      </div>

      <!-- Data Table with Checkbox for Comparison -->
      <div class="bg-white rounded-2xl custom-shadow border border-slate-200 overflow-hidden">
        <div class="p-3 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs">
          <div class="flex items-center space-x-2">
            <label class="font-bold text-slate-600" id="lblSortOrder">排序方式：</label>
            <select id="sortOrderSelect" onchange="renderTable()" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg focus:ring-1 focus:ring-brand-500 font-semibold text-slate-700">
              <option value="brand_asc">品牌字母排序 (Brand A-Z)</option>
              <option value="grade_asc">牌號排序 (Grade A-Z)</option>
              <option value="newest">最新登錄優先 (Newest First)</option>
            </select>
          </div>
          <div class="text-slate-500 font-medium" id="pageInfoText">
            顯示第 1 頁，共 0 筆
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-700">
            <thead class="bg-slate-100 font-bold border-b border-slate-200 text-slate-600">
              <tr>
                <th class="py-3.5 px-3 text-center w-12" title="勾選進行牌號並排對比">比對</th>
                <th class="py-3.5 px-3" id="thBrand">品牌 / 供應商</th>
                <th class="py-3.5 px-3" id="thGrade">牌號 (Grade)</th>
                <th class="py-3.5 px-3" id="thEth">乙烯含量</th>
                <th class="py-3.5 px-3" id="thProp">丙烯含量</th>
                <th class="py-3.5 px-3" id="thEnb">ENB / 第三單體</th>
                <th class="py-3.5 px-3" id="thOil">含油率</th>
                <th class="py-3.5 px-3" id="thMooney">門尼黏度</th>
                <th class="py-3.5 px-3" id="thForm">型態</th>
                <th class="py-3.5 px-3 text-center" id="thDocs">TDS / SDS</th>
                <th class="py-3.5 px-3 text-center" id="thAction">技術操作</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100">
              <!-- JS Injected -->
            </tbody>
          </table>
        </div>
        <!-- Pagination Controls -->
        <div class="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs">
          <button onclick="changePage(-1)" id="btnPrevPage" class="px-4 py-2 bg-white border border-slate-300 rounded-lg font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
            上一頁 (Previous)
          </button>
          <span id="pageIndicator" class="font-bold text-slate-600">Page 1 / 1</span>
          <button onclick="changePage(1)" id="btnNextPage" class="px-4 py-2 bg-white border border-slate-300 rounded-lg font-bold text-slate-700 hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
            下一頁 (Next)
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ⚖️ 懸浮比對操作列 -->
  <div id="compareBar" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40 bg-slate-900/95 text-white px-6 py-3.5 rounded-2xl shadow-2xl border border-slate-700 hidden items-center space-x-4 backdrop-blur-md transition-all">
    <div class="flex items-center space-x-2">
      <span class="text-xl">⚖️</span>
      <span class="text-sm font-bold" id="compareCounter">已選擇 0 個牌號進行比對</span>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openComparisonModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl transition-all shadow">
        🔍 開始規格並排對比
      </button>
      <button onclick="clearComparison()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded-xl transition-all">
        清除
      </button>
    </div>
  </div>

  <!-- ==================== 4. 數據並排對比 Modal ==================== -->
  <div id="comparisonModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-6">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-6xl max-h-[90vh] flex flex-col overflow-hidden transform transition-all">
      <div class="bg-slate-800 text-white flex justify-between items-center px-6 py-4 border-b border-slate-700">
        <h3 class="text-lg font-bold flex items-center space-x-2">
          <span>⚖️</span>
          <span>EPDM 規格數據並排對比 (Spec Comparison Matrix)</span>
        </h3>
        <button onclick="closeComparisonModal()" class="text-slate-400 hover:text-white bg-slate-700 p-2 rounded-full transition-colors">✕</button>
      </div>
      <div class="p-6 overflow-x-auto flex-1 bg-slate-50">
        <table class="w-full text-left text-sm border-collapse bg-white rounded-2xl shadow-sm overflow-hidden" id="compareTable">
          <!-- Dynamically Injected -->
        </table>
      </div>
    </div>
  </div>

  <!-- ==================== 5. ADMIN MODAL (ADD & EDIT) ==================== -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all">
      <div class="bg-slate-800 text-white flex justify-between items-center px-6 py-4 border-b border-slate-700">

      if (user) document.getElementById('userName').innerText = user.displayName || 'Admin';
      renderTable();
    });

    // --- DB Load & Auto Seed ---
    function loadProductsFromDB() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(async snapshot => {
        PRODUCTS = [];
        snapshot.forEach(doc => PRODUCTS.push({ id: doc.id, ...doc.data() }));

        if (PRODUCTS.length === 0) {
          for (let p of DEFAULT_RUBBER_SYSTEM) {
            await db.collection('products').doc(p.id).set({
              ...p,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } else {
          renderTable();
        }
      });
    }

    loadProductsFromDB();
    applyLanguage();

    function showInfo(desc, grade, brand, eth, prop, enb, oil, mooney, form, tds, sds) {
      const t = I18N[currentLang];
      const tdsLink = (tds && tds !== '#') ? `<a href="${tds}" target="_blank" class="text-brand-600 underline font-bold">查看 TDS 文件</a>` : '暫無專屬 TDS 檔案';
      const sdsLink = (sds && sds !== '#') ? `<a href="${sds}" target="_blank" class="text-brand-600 underline font-bold">查看 SDS 安全手冊</a>` : '暫無專屬 SDS 檔案';

      alert(`【${brand} - ${grade}】\n\n- 乙烯含量：${eth || '-'}\n- 丙烯含量：${prop || '-'}\n- ENB / 第三單體：${enb || '-'}\n- 含油率：${oil || '-'}\n- 門尼黏度：${mooney || '-'}\n- 型態：${form || '-'}\n\n文件資源：\n- TDS: ${tds || '標準技術規格'}\n- SDS: ${sds || '標準安全手冊'}\n\n特性說明：\n${desc}`);
    }

    function openDoc(url, type, grade) {
      if (!url || url === '#') {
        alert(`目前尚未上傳 ${grade} 的 ${type} 檔案，您可以聯絡彥泰企業業務團隊取得完整技術手冊。`);
        return;
      }
      window.open(url, '_blank');
    }

    function handleDelete(id) {
      if (!isAdmin) return;
      if (confirm('確定要刪除這筆資料嗎？')) {
        db.collection('products').doc(id).delete().then(() => showToast('已成功刪除', '🗑️'));
      }
    }

    function setCat(cat) {
      currentCategory = cat;
      currentSubBrand = 'ALL';
      currentPage = 1;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = (btn.dataset.c === cat) ? "cat-btn px-3.5 py-2 rounded-xl bg-brand-700 text-white font-bold shadow-sm transition-all" : "cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium";
      });
      
      const subBar = document.getElementById('subFilterBar');
      if (subBar) {
        subBar.style.display = (cat === 'EPDM_INT' || cat === 'ALL') ? 'flex' : 'none';
      }
      renderTable();
    }

    function setSubBrand(sub) {
      currentSubBrand = sub;
      currentPage = 1;
      if (sub !== 'ALL' && currentCategory === 'ALL') {
        currentCategory = 'EPDM_INT';
        document.querySelectorAll('.cat-btn').forEach(btn => {
          btn.className = (btn.dataset.c === 'EPDM_INT') ? "cat-btn px-3.5 py-2 rounded-xl bg-brand-700 text-white font-bold shadow-sm transition-all" : "cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium";
        });
        const subBar = document.getElementById('subFilterBar');
        if (subBar) subBar.style.display = 'flex';
      }

      document.querySelectorAll('.sub-btn').forEach(btn => {
        if (btn.dataset.b === sub) {
          btn.className = "sub-btn px-2.5 py-1 rounded-md bg-brand-600 text-white font-bold";
        } else {
          btn.className = "sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200";
        }
      });
      renderTable();
    }

    function resetAdvancedFilters() {
      const fForm = document.getElementById('filterForm');
      const fMooney = document.getElementById('filterMooney');
      const fEnb = document.getElementById('filterEnb');
      const sInput = document.getElementById('searchInput');
      if (fForm) fForm.value = 'ALL';
      if (fMooney) fMooney.value = 'ALL';
      if (fEnb) fEnb.value = 'ALL';
      if (sInput) sInput.value = '';
      currentPage = 1;
      renderTable();
    }

    function changePage(direction) {
      currentPage += direction;
      renderTable();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- Comparison Logic ---
    function toggleCompare(id) {
      const idx = selectedForCompare.indexOf(id);
      if (idx > -1) {
        selectedForCompare.splice(idx, 1);
      } else {
        if (selectedForCompare.length >= 4) {
          alert('最多只能同時比對 4 個牌號！');
          const chk = document.getElementById(`chk_${id}`);
          if (chk) chk.checked = false;
          return;
        }
        selectedForCompare.push(id);
      }

      const bar = document.getElementById('compareBar');
      const counter = document.getElementById('compareCounter');
      if (selectedForCompare.length > 0) {
        bar.classList.remove('hidden');
        bar.classList.add('flex');
        counter.innerText = `已選擇 ${selectedForCompare.length} 個牌號進行比對`;
      } else {
        bar.classList.remove('flex');
        bar.classList.add('hidden');
      }
    }

    function clearComparison() {
      selectedForCompare = [];
      document.querySelectorAll('.compare-chk').forEach(c => c.checked = false);
      const bar = document.getElementById('compareBar');
      bar.classList.remove('flex');
      bar.classList.add('hidden');
    }

    function openComparisonModal() {
      if (selectedForCompare.length < 2) {
        alert('請至少勾選 2 個牌號進行規格並排對比！');
        return;
      }

      const table = document.getElementById('compareTable');
      const items = PRODUCTS.filter(p => selectedForCompare.includes(p.id));

      let html = `
        <thead>
          <tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
            <th class="py-3.5 px-4 font-bold w-36">規格比對項目</th>
            ${items.map(i => `<th class="py-3.5 px-4 font-extrabold text-brand-900">${i.grade} <span class="block text-xs font-normal text-slate-500">${i.brand}</span></th>`).join('')}
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr>
            <td class="py-3 px-4 font-bold bg-slate-50 text-slate-600">乙烯含量</td>
            ${items.map(i => `<td class="py-3 px-4 font-mono font-bold text-brand-700">${i.eth || '-'}</td>`).join('')}
          </tr>
          <tr>
            <td class="py-3 px-4 font-bold bg-slate-50 text-slate-600">丙烯含量</td>
            ${items.map(i => `<td class="py-3 px-4 font-mono text-slate-700">${i.prop || '-'}</td>`).join('')}
          </tr>
          <tr>
            <td class="py-3 px-4 font-bold bg-slate-50 text-slate-600">ENB / 第三單體</td>
            ${items.map(i => `<td class="py-3 px-4 font-mono font-semibold text-slate-700">${i.enb || '-'}</td>`).join('')}
          </tr>
          <tr>
            <td class="py-3 px-4 font-bold bg-slate-50 text-slate-600">含油率</td>
            ${items.map(i => `<td class="py-3 px-4 font-mono text-slate-700">${i.oil || '-'}</td>`).join('')}
          </tr>
          <tr>
            <td class="py-3 px-4 font-bold bg-slate-50 text-slate-600">門尼黏度</td>
            ${items.map(i => `<td class="py-3 px-4 font-mono text-slate-700">${i.mooney || '-'}</td>`).join('')}
          </tr>
          <tr>
            <td class="py-3 px-4 font-bold bg-slate-50 text-slate-600">型態</td>
            ${items.map(i => `<td class="py-3 px-4 text-slate-700">${i.form || '塊膠 (Bale)'}</td>`).join('')}
          </tr>
          <tr>
            <td class="py-3 px-4 font-bold bg-slate-50 text-slate-600">應用與特性說明</td>
            ${items.map(i => `<td class="py-3 px-4 text-xs text-slate-600 leading-relaxed">${i.descZh || '-'}</td>`).join('')}
          </tr>
        </tbody>
      `;
      table.innerHTML = html;
      document.getElementById('comparisonModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeComparisonModal() {
      document.getElementById('comparisonModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    // --- Table Rendering & Advanced Filtering ---
    function renderTable() {
      const searchInput = document.getElementById('searchInput');
      const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
      
      const formVal = document.getElementById('filterForm')?.value || 'ALL';
      const mooneyVal = document.getElementById('filterMooney')?.value || 'ALL';
      const enbVal = document.getElementById('filterEnb')?.value || 'ALL';
      const sortVal = document.getElementById('sortOrderSelect')?.value || 'brand_asc';

      const tbody = document.getElementById('tableBody');
      if (!tbody) return;

      const t = I18N[currentLang];
      
      let filtered = PRODUCTS.filter(p => {
        if (currentCategory !== 'ALL' && p.category !== currentCategory) return false;
        if (currentSubBrand !== 'ALL' && p.subBrand !== currentSubBrand) return false;
        
        if (formVal !== 'ALL') {
          const fStr = (p.form || '').toLowerCase();
          if (!fStr.includes(formVal.toLowerCase())) return false;
        }

        if (mooneyVal !== 'ALL') {
          const mText = (p.mooney || '').replace(/[^0-9.]/g, '');
          const mNum = parseFloat(mText) || 0;
          if (mooneyVal === 'LOW' && mNum >= 35) return false;
          if (mooneyVal === 'MID' && (mNum < 35 || mNum > 60)) return false;
          if (mooneyVal === 'HIGH' && mNum <= 60) return false;
        }

        if (enbVal !== 'ALL') {
          const eText = (p.enb || '').replace(/[^0-9.]/g, '');
          const eNum = parseFloat(eText) || 0;
          if (enbVal === 'LOW' && (eNum >= 2 && eNum !== 0)) return false;
          if (enbVal === 'MID' && (eNum < 2 || eNum > 6)) return false;
          if (enbVal === 'HIGH' && eNum <= 6) return false;
        }

        if (q) {
          const matchBrand = (p.brand || '').toLowerCase().includes(q);
          const matchGrade = (p.grade || '').toLowerCase().includes(q);
          const matchEth = (p.eth || '').toLowerCase().includes(q);
          const matchEnb = (p.enb || '').toLowerCase().includes(q);
          const matchOil = (p.oil || '').toLowerCase().includes(q);
          const matchForm = (p.form || '').toLowerCase().includes(q);
          const matchDesc = (p.descZh || '').toLowerCase().includes(q);
          if (!matchBrand && !matchGrade && !matchEth && !matchEnb && !matchOil && !matchForm && !matchDesc) return false;
        }
        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (sortVal === 'brand_asc') {
          return (a.brand || '').localeCompare(b.brand || '');
        } else if (sortVal === 'grade_asc') {
          return (a.grade || '').localeCompare(b.grade || '');
        } else if (sortVal === 'newest') {
          const timeA = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
          const timeB = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
          return timeB - timeA;
        }
        return 0;
      });

      // Pagination calculations
      const totalItems = filtered.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedItems = filtered.slice(startIndex, startIndex + itemsPerPage);

      // Update UI elements for pagination info
      const pageInfoText = document.getElementById('pageInfoText');
      const pageIndicator = document.getElementById('pageIndicator');
      const btnPrev = document.getElementById('btnPrevPage');
      const btnNext = document.getElementById('btnNextPage');

      if (pageInfoText) pageInfoText.innerText = `顯示第 ${startIndex + 1} - ${Math.min(startIndex + itemsPerPage, totalItems)} 筆，共 ${totalItems} 筆`;
      if (pageIndicator) pageIndicator.innerText = `Page ${currentPage} / ${totalPages}`;
      if (btnPrev) btnPrev.disabled = (currentPage <= 1);
      if (btnNext) btnNext.disabled = (currentPage >= totalPages);

      if (paginatedItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-10 text-slate-400 font-medium">${t.emptyData}</td></tr>`;
        return;
      }

      tbody.innerHTML = paginatedItems.map(p => {
        const isChecked = selectedForCompare.includes(p.id) ? 'checked' : '';
        const adminBtns = isAdmin ? `
          <button onclick="openModalForEdit('${p.id}', '${p.category}', '${p.subBrand || 'OTHER'}', '${(p.brand || '').replace(/'/g, "\\'")}', '${(p.grade || '').replace(/'/g, "\\'")}', '${(p.eth || '').replace(/'/g, "\\'")}', '${(p.prop || '').replace(/'/g, "\\'")}', '${(p.enb || '').replace(/'/g, "\\'")}', '${(p.oil || '').replace(/'/g, "\\'")}', '${(p.mooney || '').replace(/'/g, "\\'")}', '${(p.form || '塊膠 (Bale)').replace(/'/g, "\\'")}', '${(p.tds || '').replace(/'/g, "\\'")}', '${(p.sds || '').replace(/'/g, "\\'")}', '${(p.descZh || '').replace(/'/g, "\\'")}')" class="px-2 py-1 bg-amber-50 text-amber-600 rounded text-xs hover:bg-amber-100 border border-amber-200 font-bold">${t.btnEdit}</button>
          <button onclick="handleDelete('${p.id}')" class="px-2 py-1 bg-red-50 text-red-600 rounded text-xs hover:bg-red-100 border border-red-200 font-bold">${t.btnDelete}</button>
        ` : '';

        return `
          <tr class="hover:bg-brand-50/50 transition-colors border-b border-slate-50">
            <td class="py-4 px-3 text-center">
              <input type="checkbox" id="chk_${p.id}" class="compare-chk w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500 cursor-pointer" onclick="toggleCompare('${p.id}')" ${isChecked}>
            </td>
            <td class="py-4 px-3 font-semibold text-slate-700 text-xs">${p.brand}</td>
            <td class="py-4 px-3 font-mono text-sm text-brand-900 font-extrabold">${p.grade}</td>
            <td class="py-4 px-3 font-mono text-xs text-brand-700 font-bold">${p.eth || '-'}</td>
            <td class="py-4 px-3 font-mono text-xs text-slate-600">${p.prop || '-'}</td>
            <td class="py-4 px-3 font-mono text-xs text-slate-600">${p.enb || '-'}</td>
            <td class="py-4 px-3 font-mono text-xs text-slate-600">${p.oil || '-'}</td>
            <td class="py-4 px-3 font-mono text-xs text-slate-600">${p.mooney || '-'}</td>
            <td class="py-4 px-3 text-xs text-slate-600">${p.form || '塊膠 (Bale)'}</td>
            <td class="py-4 px-3 text-center">
              <div class="flex justify-center items-center space-x-1">
                <button onclick="openDoc('${p.tds || '#'}', 'TDS', '${p.grade}')" class="px-2 py-1 rounded bg-sky-50 text-sky-700 border border-sky-200 text-xs font-bold hover:bg-sky-100 transition-colors" title="技術資料表 (Technical Data Sheet)">TDS</button>
                <button onclick="openDoc('${p.sds || '#'}', 'SDS', '${p.grade}')" class="px-2 py-1 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold hover:bg-emerald-100 transition-colors" title="安全資料表 (Safety Data Sheet)">SDS</button>
              </div>
            </td>
            <td class="py-4 px-3 text-center">
              <div class="flex justify-center items-center space-x-1.5">
                <button onclick="showInfo('${(p.descZh || '').replace(/'/g, "\\'")}', '${p.grade}', '${p.brand}', '${p.eth || ''}', '${p.prop || ''}', '${p.enb || ''}', '${p.oil || ''}', '${p.mooney || ''}', '${p.form || ''}', '${p.tds || ''}', '${p.sds || ''}')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-brand-50 text-brand-700 border border-brand-200 hover:bg-brand-100 transition-all">
                  ${t.viewInfo}
                </button>
                ${adminBtns}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // --- Modal Management ---
    function openModalForAdd() {
      if (!isAdmin) return;
      isEditing = false;
      document.getElementById('modalAdminTitle').innerText = "新增橡膠產品資料";
      document.getElementById('upId').value = '';
      document.getElementById('upId').disabled = false;
      document.getElementById('upBrand').value = '';
      document.getElementById('upGrade').value = '';
      document.getElementById('upEth').value = '';
      document.getElementById('upProp').value = '';
      document.getElementById('upEnb').value = '';
      document.getElementById('upOil').value = '';
      document.getElementById('upTds').value = '';
      document.getElementById('upSds').value = '';
      document.getElementById('upMooney').value = '';
      document.getElementById('upMooneyTemp').value = '@125°C';
      document.getElementById('upForm').value = '塊膠 (Bale)';
      document.getElementById('upDesc').value = '';
      document.getElementById('adminModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function openModalForEdit(id, category, subBrand, brand, grade, eth, prop, enb, oil, mooneyFull, form, tds, sds, desc) {
      if (!isAdmin) return;
      isEditing = true;
      document.getElementById('modalAdminTitle').innerText = "修改橡膠產品資料";
      document.getElementById('upId').value = id;
      document.getElementById('upId').disabled = true;
      document.getElementById('upCat').value = category;
      document.getElementById('upSubBrand').value = subBrand;
      document.getElementById('upBrand').value = brand;
      document.getElementById('upGrade').value = grade;
      document.getElementById('upEth').value = eth;
      document.getElementById('upProp').value = prop;
      document.getElementById('upEnb').value = enb;
      document.getElementById('upOil').value = oil;
      document.getElementById('upTds').value = tds || '';
      document.getElementById('upSds').value = sds || '';
      
      let mVal = mooneyFull;
      let mTemp = '@125°C';
      if (mooneyFull.includes('@100°C')) { mVal = mooneyFull.replace('@100°C','').trim(); mTemp = '@100°C'; }
      else if (mooneyFull.includes('@150°C')) { mVal = mooneyFull.replace('@150°C','').trim(); mTemp = '@150°C'; }
      else if (mooneyFull.includes('@125°C')) { mVal = mooneyFull.replace('@125°C','').trim(); mTemp = '@125°C'; }

      document.getElementById('upMooney').value = mVal;
      document.getElementById('upMooneyTemp').value = mTemp;
      document.getElementById('upForm').value = form;
      document.getElementById('upDesc').value = desc;
      document.getElementById('adminModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    async function submitProductData() {
      if (!isAdmin) return;
      const id = document.getElementById('upId').value.trim();
      const brand = document.getElementById('upBrand').value.trim();
      const grade = document.getElementById('upGrade').value.trim();
      
      if (!id || !brand || !grade) {
        alert('請填寫完整代碼、品牌與牌號！');
        return;
      }

      const mVal = document.getElementById('upMooney').value.trim();
      const mTemp = document.getElementById('upMooneyTemp').value;
      const finalMooney = mVal ? `${mVal} ${mTemp}` : '';

      try {
        const payload = {
          category: document.getElementById('upCat').value,
          subBrand: document.getElementById('upSubBrand').value,
          brand: brand,
          grade: grade,
          eth: document.getElementById('upEth').value.trim(),
          prop: document.getElementById('upProp').value.trim(),
          enb: document.getElementById('upEnb').value.trim(),
          oil: document.getElementById('upOil').value.trim(),
          tds: document.getElementById('upTds').value.trim() || '#',
          sds: document.getElementById('upSds').value.trim() || '#',
          mooney: finalMooney,
          form: document.getElementById('upForm').value,
          descZh: document.getElementById('upDesc').value.trim() || '標準規格說明',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (isEditing) delete payload.createdAt;

        await db.collection('products').doc(id).set(payload, { merge: true });
        showToast('儲存成功！', '✅');
        closeAdminModal();
      } catch (err) {
        alert('儲存失敗: ' + err.message);
      }
    }

    function showToast(msg, icon) {
      const tb = document.getElementById('toastBox');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      tb.classList.remove('translate-y-24', 'opacity-0');
      tb.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        tb.classList.remove('translate-y-0', 'opacity-100');
        tb.classList.add('translate-y-24', 'opacity-0');
      }, 3500);
    }
  </script>
</body>
