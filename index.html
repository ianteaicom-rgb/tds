<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>彥泰企業 IANTEAI - 彥泰企業橡膠技術資料庫</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { 
            brand: { 50: '#F0F5FA', 100: '#E1EBF5', 600: '#2B6CB0', 700: '#1F497D', 800: '#16365C', 900: '#0F243E' }, 
            eco: { 600: '#276749', 700: '#22543D', 800: '#1B4332' } 
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    .glass-nav { background: rgba(31, 73, 125, 0.96); backdrop-filter: blur(10px); }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(15, 36, 62, 0.08), 0 2px 6px -1px rgba(15, 36, 62, 0.04); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased pb-24 md:pb-12">

  <!-- 1. HEADER & AUTH -->
  <header class="glass-nav text-white sticky top-0 z-40 border-b border-brand-800 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center justify-between py-2 sm:py-0 sm:h-20 gap-2">
      <!-- Logo & Title -->
      <div class="flex items-center space-x-3">
        <svg class="w-10 h-10 sm:w-12 sm:h-12 drop-shadow-md" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="#1F497D" stroke="#38BDF8" stroke-width="3"/>
          <text x="50" y="58" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">TIT</text>
        </svg>
        <div>
          <h1 class="text-base sm:text-xl font-bold tracking-tight text-white flex items-center space-x-2">
            <span>彥泰企業 IANTEAI</span>
            <span id="brandTag" class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 hidden md:inline">全系統橡膠與 EPDM 專家資料庫</span>
          </h1>
        </div>
      </div>

      <!-- Auth Panel & Language -->
      <div class="flex items-center space-x-3 text-sm">
        <div id="authContainer" class="flex items-center bg-brand-900/50 rounded-lg p-1.5 border border-brand-700">
          <div id="authLoading" class="px-2 text-xs text-brand-300 animate-pulse hidden">Loading...</div>
          
          <button id="btnLogin" onclick="loginWithGooglePopup()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-md bg-white text-slate-800 font-semibold hover:bg-slate-100 transition-colors text-xs">
            <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            <span id="txtLoginBtn">管理員登入</span>
          </button>

          <div id="userProfile" class="hidden flex items-center space-x-2.5 px-2">
            <img id="userAvatar" src="" class="w-7 h-7 rounded-full border border-brand-500">
            <div class="flex flex-col">
              <div class="flex items-center space-x-1.5">
                <span id="userName" class="font-bold text-[13px] truncate max-w-[90px]">Admin</span>
                <span id="adminBadge" class="bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">Admin</span>
              </div>
              <div class="flex items-center space-x-2 text-[11px] text-sky-200">
                <button onclick="logout()" id="txtLogoutBtn" class="hover:text-white underline">登出系統</button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Language Toggle -->
        <button onclick="toggleLanguage()" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold border border-white/20 transition-all ml-2">
          <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
          <span id="langDisplay">EN</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. ADMIN CONTROL STRIP -->
  <section id="adminPanel" class="hidden bg-red-50 border-b border-red-200 py-3 shadow-inner">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3 text-sm">
      <div class="flex items-center space-x-2 text-red-800 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span id="txtAdminTitle">總管理員控制台</span>
      </div>
      <button onclick="openModalForAdd()" class="px-4 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold shadow hover:bg-red-700 transition-colors flex items-center space-x-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        <span id="txtAdminBtn">新增橡膠產品資料</span>
      </button>
    </div>
  </section>

  <!-- 3. MAIN CONTENT & SEARCH -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full relative">
    <div id="mainContent" class="transition-opacity duration-500">
      
      <!-- Search & Category Filters -->
      <div class="bg-white rounded-2xl p-4 sm:p-6 custom-shadow border border-slate-200/80 mb-6 space-y-4">
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
          <!-- 智慧即時搜索框 -->
          <div class="relative w-full md:w-[420px]">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="快速搜索：輸入品牌 (DOW, Exxon)、牌號 (4725P, 4570) 或膠種..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
          </div>
          
          <!-- 膠種大分類快速按鈕 -->
          <div class="flex flex-wrap gap-2 text-xs items-center justify-end w-full md:w-auto">
            <button onclick="setCat('ALL')" class="cat-btn px-3.5 py-2 rounded-xl bg-brand-700 text-white font-bold shadow-sm transition-all" data-c="ALL" id="catAll">全部</button>
            <button onclick="setCat('EPDM_INT')" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium" data-c="EPDM_INT" id="catEpdmInt">🌍 國際大廠 EPDM</button>
            <button onclick="setCat('REPRO')" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium" data-c="REPRO" id="catRepro">♻️ 彥泰環保再製膠</button>
            <button onclick="setCat('SYNTHETIC')" class="cat-btn px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all font-medium" data-c="SYNTHETIC" id="catSynthetic">🧪 合成橡膠 (BR/SBR/NBR)</button>
          </div>
        </div>

        <!-- 子品牌快速篩選標籤列 -->
        <div id="subFilterBar" class="flex flex-wrap gap-1.5 pt-2 border-t border-slate-100 text-xs">
          <span class="text-slate-400 self-center mr-1 font-semibold" id="lblBrandFilter">品牌快速篩選：</span>
          <button onclick="setSubBrand('ALL')" class="sub-btn px-2.5 py-1 rounded-md bg-brand-600 text-white font-bold" data-b="ALL" id="subAll">全部品牌</button>
          <button onclick="setSubBrand('DOW')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="DOW">DOW</button>
          <button onclick="setSubBrand('EXXON')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="EXXON">ExxonMobil</button>
          <button onclick="setSubBrand('ARLANXEO')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="ARLANXEO">ARLANXEO</button>
          <button onclick="setSubBrand('MITSUI')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="MITSUI">Mitsui</button>
          <button onclick="setSubBrand('KUMHO_SK')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="KUMHO_SK">Kumho / SK</button>
          <button onclick="setSubBrand('LION_LVE')" class="sub-btn px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-b="LION_LVE">LION / LVE</button>
          <button onclick="setSubBrand('IANTEAI')" class="sub-btn px-2.5 py-1 rounded-md bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-bold" data-b="IANTEAI" id="subIanteai">⭐ 彥泰精煉專區</button>
        </div>
      </div>

      <!-- Data Table with Checkbox for Comparison -->
      <div class="bg-white rounded-2xl custom-shadow border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-700">
            <thead class="bg-slate-100 font-bold border-b border-slate-200 text-slate-600">
              <tr>
                <th class="py-3.5 px-3 text-center w-12" title="勾選進行牌號並排對比">比對</th>
                <th class="py-3.5 px-4" id="thCategory">系列分類</th>
                <th class="py-3.5 px-4" id="thBrand">品牌 / 供應商</th>
                <th class="py-3.5 px-4" id="thGrade">牌號 (Grade)</th>
                <th class="py-3.5 px-4" id="thMooney">門尼黏度 / 特性</th>
                <th class="py-3.5 px-4" id="thApp">核心應用與說明</th>
                <th class="py-3.5 px-4 text-center" id="thAction">技術操作</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100">
              <!-- JS Injected -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- ⚖️ 懸浮比對操作列 (當勾選牌號時浮現) -->
  <div id="compareBar" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40 bg-slate-900/95 text-white px-6 py-3.5 rounded-2xl shadow-2xl border border-slate-700 hidden items-center space-x-4 backdrop-blur-md transition-all">
    <div class="flex items-center space-x-2">
      <span class="text-xl">⚖️</span>
      <span class="text-sm font-bold" id="compareCounter">已選擇 0 個牌號進行比對</span>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openComparisonModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl transition-all shadow">
        🔍 開始數據並排對比
      </button>
      <button onclick="clearComparison()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded-xl transition-all">
        清除
      </button>
    </div>
  </div>

  <!-- ==================== 4. 數據並排對比 Modal ==================== -->
  <div id="comparisonModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-6">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-6xl max-h-[90vh] flex flex-col overflow-hidden transform transition-all">
      <div class="bg-slate-800 text-white flex justify-between items-center px-6 py-4 border-b border-slate-700">
        <h3 class="text-lg font-bold flex items-center space-x-2">
          <span>⚖️</span>
          <span>EPDM 牌號智慧並排對比 (Spec Comparison)</span>
        </h3>
        <button onclick="closeComparisonModal()" class="text-slate-400 hover:text-white bg-slate-700 p-2 rounded-full transition-colors">✕</button>
      </div>
      <div class="p-6 overflow-x-auto flex-1 bg-slate-50">
        <table class="w-full text-left text-sm border-collapse bg-white rounded-2xl shadow-sm overflow-hidden" id="compareTable">
          <!-- Dynamically Injected Comparison Matrix -->
        </table>
      </div>
    </div>
  </div>

  <!-- ==================== 5. ADMIN MODAL (ADD & EDIT) ==================== -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all">
      <div class="bg-slate-800 text-white flex justify-between items-center px-6 py-4 border-b border-slate-700">
        <h2 id="modalAdminTitle" class="text-xl font-bold">新增橡膠產品資料</h2>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white bg-slate-700 p-1.5 rounded-full">✕</button>
      </div>
      <div class="p-6 space-y-4 text-sm max-h-[80vh] overflow-y-auto">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-1">產品代碼 (ID, 不能重複)</label>
            <input type="text" id="upId" placeholder="ex: dow-nordel-4725p" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block font-bold mb-1">大分類</label>
            <select id="upCat" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500">
              <option value="EPDM_INT">EPDM_INT (國際大廠 EPDM)</option>
              <option value="REPRO">REPRO (彥泰環保再製膠)</option>
              <option value="SYNTHETIC">SYNTHETIC (合成橡膠 BR/SBR/NBR)</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-1">品牌 / 供應商</label>
            <input type="text" id="upBrand" placeholder="DOW (陶氏) / 彥泰精煉" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block font-bold mb-1">代表牌號 (Grade)</label>
            <input type="text" id="upGrade" placeholder="Nordel 4725P / EPDM 3760" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-bold mb-1">門尼黏度 / 特性標籤</label>
            <input type="text" id="upMooney" placeholder="ML(1+4): 25 或 高白精煉" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500">
          </div>
          <div>
            <label class="block font-bold mb-1">次要品牌標籤</label>
            <select id="upSubBrand" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500">
              <option value="DOW">DOW</option>
              <option value="EXXON">ExxonMobil</option>
              <option value="ARLANXEO">ARLANXEO</option>
              <option value="MITSUI">Mitsui</option>
              <option value="KUMHO_SK">Kumho / SK</option>
              <option value="LION_LVE">LION / LVE</option>
              <option value="IANTEAI">彥泰精煉 (IANTEAI)</option>
              <option value="OTHER">其他系列</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-bold mb-1">詳細物性與應用特性說明 (Description)</label>
          <textarea id="upDesc" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-brand-500" placeholder="請輸入門尼、乙烯含量、主要應用領域與替代優勢..."></textarea>
        </div>
        <button onclick="submitProductData()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-md transition-colors">確認儲存產品資料</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastBox" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white text-sm px-5 py-3.5 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
      <span id="toastIcon">✅</span>
      <span id="toastMessage" class="font-bold">操作成功！</span>
    </div>
  </div>

  <!-- ==================== 6. FIREBASE & APP LOGIC ==================== -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpO_mIskiWSp_iueCV44GEB1bK0QZD-cA",
      authDomain: "ianteai-catalog.firebaseapp.com",
      projectId: "ianteai-catalog",
      storageBucket: "ianteai-catalog.firebasestorage.app",
      messagingSenderId: "1083778078282",
      appId: "1:1083778078282:web:d66273b774993dd65ef8b3",
      measurementId: "G-X974ME7WQN"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentLang = 'zh';
    let currentUser = null;
    let isAdmin = false;
    let currentCategory = 'ALL';
    let currentSubBrand = 'ALL';
    let PRODUCTS = [];
    let isEditing = false;
    let selectedForCompare = []; // 儲存勾選比對的產品 ID

    // --- 完整內建資料庫 ---
    const DEFAULT_RUBBER_SYSTEM = [
      { id: 'dow-4725p', category: 'EPDM_INT', subBrand: 'DOW', brand: 'DOW (陶氏 Nordel)', grade: 'Nordel 4725P', mooney: '25 (ML 1+4, 125°C)', descZh: '高乙烯、中門尼，優異的耐天候與強度，廣泛應用於汽車密封條與建築防水膜。' },

    // --- Firebase Auth ---
    function loginWithGooglePopup() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("登入失敗: " + err.message));
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
      isAdmin = user && ADMIN_EMAILS.includes(user.email);
      const btnLogin = document.getElementById('btnLogin');
      if (btnLogin) btnLogin.classList.toggle('hidden', !!user);

      const userProfile = document.getElementById('userProfile');
      if (userProfile) userProfile.classList.toggle('hidden', !user);

      const adminPanel = document.getElementById('adminPanel');
      if (adminPanel) adminPanel.classList.toggle('hidden', !isAdmin);

      const userName = document.getElementById('userName');
      if (user && userName) userName.innerText = user.displayName || 'Admin';
      renderTable();
    });

    // --- DB Load & Auto Seed ---
    function loadProductsFromDB() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(async snapshot => {
        PRODUCTS = [];
        snapshot.forEach(doc => PRODUCTS.push({ id: doc.id, ...doc.data() }));

        if (PRODUCTS.length === 0) {
          for (let p of DEFAULT_RUBBER_SYSTEM) {
            await db.collection('products').doc(p.id).set({
              ...p,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } else {
          renderTable();
        }
      });
    }

    loadProductsFromDB();
    applyLanguage();

    // --- Actions ---
    function showInfo(desc, grade, brand) {
      alert(`【${brand} - ${grade}】\n\n物性與應用說明：\n${desc}`);
    }

    function handleDelete(id) {
      if (!isAdmin) return;
      if (confirm('確定要刪除這筆資料嗎？')) {
        db.collection('products').doc(id).delete().then(() => showToast('已刪除', '🗑️'));
      }
    }

    // --- Comparison Logic ---
    function toggleCompare(id) {
      const idx = selectedForCompare.indexOf(id);
      if (idx > -1) {
        selectedForCompare.splice(idx, 1);
      } else {
        if (selectedForCompare.length >= 4) {
          alert('最多同時比對 4 個牌號！');
          document.getElementById(`chk_${id}`).checked = false;
          return;
        }
        selectedForCompare.push(id);
      }
      updateCompareBar();
    }

    function updateCompareBar() {
      const bar = document.getElementById('compareBar');
      const counter = document.getElementById('compareCounter');
      if (selectedForCompare.length > 0) {
        bar.classList.remove('hidden');
        bar.classList.add('flex');
        counter.innerText = `已選擇 ${selectedForCompare.length} 個牌號進行比對 (最多4個)`;
      } else {
        bar.classList.remove('flex');
        bar.classList.add('hidden');
      }
    }

    function clearComparison() {
      selectedForCompare = [];
      document.querySelectorAll('.compare-chk').forEach(chk => chk.checked = false);
      updateCompareBar();
    }

      if (selectedForCompare.length < 2) {

    // --- Table Rendering & Realtime Search ---
    function renderTable() {
      const searchInput = document.getElementById('searchInput');
      const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const tbody = document.getElementById('tableBody');
      if (!tbody) return;

      const t = I18N[currentLang];
      
      const filtered = PRODUCTS.filter(p => {
        if (currentCategory !== 'ALL' && p.category !== currentCategory) return false;
        if (currentCategory === 'EPDM_INT' && currentSubBrand !== 'ALL' && p.subBrand !== currentSubBrand) return false;
        
        if (q) {
          const matchBrand = (p.brand || '').toLowerCase().includes(q);
          const matchGrade = (p.grade || '').toLowerCase().includes(q);
          const matchId = (p.id || '').toLowerCase().includes(q);
          const matchDesc = (p.descZh || '').toLowerCase().includes(q);
          const matchCat = (p.category || '').toLowerCase().includes(q);
          if (!matchBrand && !matchGrade && !matchId && !matchDesc && !matchCat) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-slate-400 font-medium">${t.emptyData}</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        let badgeHtml = '<span class="px-2 py-1 rounded text-xs font-bold bg-slate-100 text-slate-700">其他</span>';
        if (p.category === 'EPDM_INT') {
          badgeHtml = '<span class="px-2.5 py-1 rounded text-xs font-extrabold bg-sky-100 text-sky-800 border border-sky-200">🌍 國際 EPDM</span>';
        } else if (p.category === 'REPRO') {
          badgeHtml = '<span class="px-2.5 py-1 rounded text-xs font-extrabold bg-emerald-100 text-emerald-800 border border-emerald-200">♻️ 彥泰再製膠</span>';
        } else if (p.category === 'SYNTHETIC') {
          badgeHtml = '<span class="px-2.5 py-1 rounded text-xs font-extrabold bg-indigo-100 text-indigo-800 border border-indigo-200">🧪 合成橡膠</span>';
        }

        const isChecked = selectedForCompare.includes(p.id) ? 'checked' : '';
        const adminBtns = isAdmin ? `
          <button onclick="openModalForEdit('${p.id}', '${p.category}', '${p.subBrand || 'OTHER'}', '${(p.brand || '').replace(/'/g, "\\'")}', '${(p.grade || '').replace(/'/g, "\\'")}', '${(p.mooney || '').replace(/'/g, "\\'")}', '${(p.descZh || '').replace(/'/g, "\\'")}')" class="px-2 py-1 bg-amber-50 text-amber-600 rounded text-xs hover:bg-amber-100 border border-amber-200 font-bold">${t.btnEdit}</button>
          <button onclick="handleDelete('${p.id}')" class="px-2 py-1 bg-red-50 text-red-600 rounded text-xs hover:bg-red-100 border border-red-200 font-bold">${t.btnDelete}</button>
        ` : '';

        return `
          <tr class="hover:bg-brand-50/50 transition-colors border-b border-slate-50">
            <td class="py-4 px-3 text-center">
              <input type="checkbox" id="chk_${p.id}" class="compare-chk w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500 cursor-pointer" onclick="toggleCompare('${p.id}')" ${isChecked}>
            </td>
            <td class="py-4 px-4">${badgeHtml}</td>
            <td class="py-4 px-4 font-bold text-slate-700">${p.brand}</td>
            <td class="py-4 px-4 font-mono text-sm text-brand-900 font-extrabold">${p.grade}</td>
            <td class="py-4 px-4 font-mono text-xs text-slate-600">${p.mooney || '-'}</td>
            <td class="py-4 px-4 text-xs text-slate-600 max-w-xs truncate">${p.descZh || '-'}</td>
            <td class="py-4 px-4 text-center">
              <div class="flex justify-center items-center space-x-2">
                <button onclick="showInfo('${(p.descZh || '').replace(/'/g, "\\'")}', '${p.grade}', '${p.brand}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-brand-50 text-brand-700 border border-brand-200 hover:bg-brand-100 transition-all">
                  ${t.viewInfo}
                </button>
                ${adminBtns}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openModalForEdit(id, category, subBrand, brand, grade, mooney, desc) {
      if (!isAdmin) return;
      isEditing = true;
      document.getElementById('modalAdminTitle').innerText = "修改橡膠產品資料";
      document.getElementById('upId').value = id;
      document.getElementById('upId').disabled = true;
      document.getElementById('upCat').value = category;
      document.getElementById('upSubBrand').value = subBrand;
      document.getElementById('upBrand').value = brand;
      document.getElementById('upGrade').value = grade;
      document.getElementById('upMooney').value = mooney;
      document.getElementById('upDesc').value = desc;
      document.getElementById('adminModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    async function submitProductData() {
      if (!isAdmin) return;
      const id = document.getElementById('upId').value.trim();
      const brand = document.getElementById('upBrand').value.trim();
      const grade = document.getElementById('upGrade').value.trim();
      
      if (!id || !brand || !grade) {
        alert('請填寫完整代碼、品牌與牌號！');
        return;
      }

      try {
        const payload = {
          category: document.getElementById('upCat').value,
          subBrand: document.getElementById('upSubBrand').value,
          brand: brand,
          grade: grade,
          mooney: document.getElementById('upMooney').value.trim(),
          descZh: document.getElementById('upDesc').value.trim() || '橡膠標準規格說明',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (isEditing) delete payload.createdAt;

        await db.collection('products').doc(id).set(payload, { merge: true });
        showToast('儲存成功！', '✅');
        closeAdminModal();
      } catch (err) {
        alert('儲存失敗: ' + err.message);
      }
    }

    function showToast(msg, icon) {
      const tb = document.getElementById('toastBox');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      tb.classList.remove('translate-y-24', 'opacity-0');
      tb.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        tb.classList.remove('translate-y-0', 'opacity-100');
        tb.classList.add('translate-y-24', 'opacity-0');
      }, 3500);
    }
  </script>
</body>
