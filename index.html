<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>彥泰企業 IANTEAI - 產品技術手冊資料庫</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 50: '#F0F5FA', 100: '#E1EBF5', 600: '#2B6CB0', 700: '#1F497D', 800: '#16365C', 900: '#0F243E' }, eco: { 600: '#276749', 700: '#22543D' } }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    .glass-nav { background: rgba(31, 73, 125, 0.96); backdrop-filter: blur(10px); }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(15, 36, 62, 0.08), 0 2px 6px -1px rgba(15, 36, 62, 0.04); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased pb-16 md:pb-6">

  <!-- 1. HEADER & AUTH -->
  <header class="glass-nav text-white sticky top-0 z-40 border-b border-brand-800 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center justify-between py-2 sm:py-0 sm:h-20 gap-2">
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <svg class="w-10 h-10 sm:w-12 sm:h-12 drop-shadow-md" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="#1F497D" stroke="#38BDF8" stroke-width="3"/>
          <text x="50" y="58" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">TIT</text>
        </svg>
        <div>
          <h1 class="text-base sm:text-xl font-bold tracking-tight text-white flex items-center space-x-2">
            <span id="brandName">彥泰企業 IANTEAI</span>
            <span id="brandTag" class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 hidden md:inline">技術資料庫</span>
          </h1>
        </div>
      </div>

      <!-- Auth Panel -->
      <div class="flex items-center space-x-3 text-sm">
        <div id="authContainer" class="flex items-center bg-brand-900/50 rounded-lg p-1.5 border border-brand-700">
          <div id="authLoading" class="px-2 text-xs text-brand-300 animate-pulse hidden">Loading...</div>
          
          <button id="btnLogin" onclick="loginWithGooglePopup()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-md bg-white text-slate-800 font-semibold hover:bg-slate-100 transition-colors text-xs">
            <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            <span id="txtLoginBtn">管理員登入</span>
          </button>

          <div id="userProfile" class="hidden flex items-center space-x-2.5 px-2">
            <img id="userAvatar" src="" class="w-7 h-7 rounded-full border border-brand-500">
            <div class="flex flex-col">
              <div class="flex items-center space-x-1.5">
                <span id="userName" class="font-bold text-[13px] truncate max-w-[90px]">Admin</span>
                <span id="adminBadge" class="bg-red-600 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">Admin</span>
              </div>
              <div class="flex items-center space-x-2 text-[11px] text-sky-200">
                <button onclick="logout()" id="txtLogoutBtn" class="hover:text-white underline">登出系統</button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Language Toggle -->
        <button onclick="toggleLanguage()" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold border border-white/20 transition-all ml-2">
          <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
          <span id="langDisplay">EN</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. ADMIN PANEL STRIP -->
  <section id="adminPanel" class="hidden bg-red-50 border-b border-red-200 py-3 shadow-inner">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap items-center justify-between gap-3 text-sm">
      <div class="flex items-center space-x-2 text-red-800 font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span id="txtAdminTitle">總管理員控制台</span>
      </div>
      <button onclick="openAdminModal()" class="px-4 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold shadow hover:bg-red-700 transition-colors flex items-center space-x-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span id="txtAdminBtn">新增產品資料 (免上傳檔案)</span>
      </button>
    </div>
  </section>

  <!-- 3. MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full relative">
    <div id="mainContent" class="transition-opacity duration-500">
      
      <!-- Filters -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 custom-shadow border border-slate-200/80 mb-6">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
          <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋 DOW EPDM 牌號或名稱..." class="w-full sm:w-96 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500">
          <div class="flex gap-2 text-xs">
            <button onclick="setCat('ALL')" class="cat-btn px-3 py-1.5 rounded-lg bg-brand-700 text-white font-bold" data-c="ALL" id="catAll">全部</button>
            <button onclick="setCat('RUBBER')" class="cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200" data-c="RUBBER" id="catRubber">橡膠</button>
            <button onclick="setCat('PLASTICS')" class="cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200" data-c="PLASTICS" id="catPlastics">塑膠</button>
            <button onclick="setCat('CHEMICAL')" class="cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200" data-c="CHEMICAL" id="catChem">化工</button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl custom-shadow border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-700">
            <thead class="bg-slate-100 font-bold border-b border-slate-200">
              <tr>
                <th class="py-3 px-4" id="thCat">分類</th>
                <th class="py-3 px-4" id="thName">品名 (中/英)</th>
                <th class="py-3 px-4" id="thGrade">DOW 牌號 / 規格</th>
                <th class="py-3 px-4 text-center" id="thAction">技術資料與安全手冊操作</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100">
              <!-- JS Injected -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== 4. ADMIN UPLOAD MODAL ==================== -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all">
      
      <!-- Modal Header -->
      <div class="bg-slate-800 text-white flex justify-between items-center px-6 py-4 border-b border-slate-700">
        <h2 class="text-xl font-bold text-white flex items-center space-x-2">
          <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded uppercase tracking-wide">Admin</span>
          <span id="modalAdminTitle">新增產品資料 (文字規格)</span>
        </h2>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white bg-slate-700 hover:bg-slate-600 p-1.5 rounded-full transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6">
        <div class="space-y-4 text-sm">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block font-bold text-slate-600 mb-1" id="lblUpId">產品代碼 (ID, 不能重複)</label>
              <input type="text" id="upId" placeholder="ex: dow-nordel-3720p" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
              <label class="block font-bold text-slate-600 mb-1" id="lblUpCat">所屬分類</label>
              <select id="upCat" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                <option value="RUBBER">橡膠 RUBBER</option>
                <option value="PLASTICS">塑膠 PLASTICS</option>
                <option value="CHEMICAL">化工填料 CHEMICAL</option>
                <option value="OTHERS">其他 OTHERS</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block font-bold text-slate-600 mb-1" id="lblUpZh">中文品名</label>
              <input type="text" id="upNameZh" placeholder="陶氏三元乙丙橡膠" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
              <label class="block font-bold text-slate-600 mb-1" id="lblUpEn">英文品名</label>
              <input type="text" id="upNameEn" placeholder="DOW Nordel EPDM" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-600 mb-1" id="lblUpGr">代表牌號 (Grade)</label>
            <input type="text" id="upGrade" placeholder="Nordel 4725P / 3720P" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>

          <button onclick="submitUpload()" id="btnSubmitUpload" class="w-full py-3 mt-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-lg flex justify-center items-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            <span id="txtBtnSubmit">確認新增產品</span>
          </button>

        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastBox" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900/95 text-white text-sm px-5 py-3.5 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
      <span id="toastIcon" class="text-xl">✅</span>
      <span id="toastMessage" class="font-bold tracking-wide">操作成功！</span>
    </div>
  </div>

  <!-- ==================== 5. FIREBASE & APP LOGIC ==================== -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBpO_mIskiWSp_iueCV44GEB1bK0QZD-cA",
      authDomain: "ianteai-catalog.firebaseapp.com",
      projectId: "ianteai-catalog",
      storageBucket: "ianteai-catalog.firebasestorage.app",
      messagingSenderId: "1083778078282",
      appId: "1:1083778078282:web:d66273b774993dd65ef8b3",
      measurementId: "G-X974ME7WQN"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentLang = 'zh';
    let currentUser = null;
    let isAdmin = false;
    let currentCategory = 'ALL';
    let PRODUCTS = [];

    // --- 預設 DOW (陶氏) EPDM 牌號資料 (當資料庫為空或初始化時自動載入) ---
    const DEFAULT_DOW_PRODUCTS = [
      { id: 'dow-4725p', category: 'RUBBER', nameZh: '陶氏三元乙丙橡膠', nameEn: 'DOW Nordel EPDM', grade: 'Nordel 4725P', descZh: '高門尼、高乙烯，適用於汽車密封條與建築防水卷材', descEn: 'High Mooney, high ethylene for automotive seals and roofing.' },
      { id: 'dow-3720p', category: 'RUBBER', nameZh: '陶氏三元乙丙橡膠', nameEn: 'DOW Nordel EPDM', grade: 'Nordel 3720P', descZh: '中低門尼，優異的加工流動性與混煉分散性', descEn: 'Medium-low Mooney, excellent processability.' },
      { id: 'dow-3745p', category: 'RUBBER', nameZh: '陶氏三元乙丙橡膠', nameEn: 'DOW Nordel EPDM', grade: 'Nordel 3745P', descZh: '通用型級別，兼具良好的機械強度與擠出表現', descEn: 'General purpose, balanced strength and extrusion.' },
      { id: 'dow-4770r', category: 'RUBBER', nameZh: '陶氏三元乙丙橡膠', nameEn: 'DOW Nordel EPDM', grade: 'Nordel 4770R', descZh: '超高門尼，適用於高填充、低成本橡膠擠出製品', descEn: 'Ultra-high Mooney for high filler loading.' },
      { id: 'dow-IP-5565', category: 'RUBBER', nameZh: '陶氏烴類共聚物彈性體', nameEn: 'DOW Nordel IP', grade: 'Nordel IP 5565', descZh: '催化劑先進技術，極佳的色澤穩定性與耐熱老化', descEn: 'Advanced catalyst tech, exceptional color stability.' },
      { id: 'dow-IP-3640', category: 'RUBBER', nameZh: '陶氏烴類共聚物彈性體', nameEn: 'DOW Nordel IP', grade: 'Nordel IP 3640', descZh: '低結晶度，柔軟度佳，適用於耐寒彈性製品', descEn: 'Low crystallinity, high flexibility at low temp.' }
    ];

    const ADMIN_EMAILS = ['marswu@example.com', 'ianteai.com@gmail.com', 'boss@ianteai.com'];

    const I18N = {
      zh: {
        langBtn: 'EN',
        brandTag: '技術資料庫',
        txtLoginBtn: '管理員登入',
        txtLogoutBtn: '登出系統',
        txtAdminTitle: '總管理員控制台',
        txtAdminBtn: '新增產品資料',
        searchPh: '搜尋 DOW EPDM 牌號或名稱...',
        catAll: '全部', catRubber: '橡膠', catPlastics: '塑膠', catChem: '化工',
        thCat: '分類', thName: '品名 (中/英)', thGrade: 'DOW 牌號 / 規格', thAction: '技術資料與安全手冊操作',
        emptyData: '尚無資料',
        modalAdminTitle: '新增產品資料 (文字規格)',
        lblUpId: '產品代碼 (ID, 不能重複)', lblUpCat: '所屬分類', lblUpZh: '中文品名', lblUpEn: '英文品名', lblUpGr: '代表牌號 (Grade)',
        txtBtnSubmit: '確認新增產品',
        btnDelete: '刪除',

      },
      en: {
        langBtn: '中文',
        brandTag: 'Database',
        txtLoginBtn: 'Admin Login',
        txtLogoutBtn: 'Logout',
        txtAdminTitle: 'Admin Dashboard',
        txtAdminBtn: 'Add Product Data',
        searchPh: 'Search DOW EPDM grade...',
        catAll: 'All', catRubber: 'Rubber', catPlastics: 'Plastics', catChem: 'Chemical',
        thCat: 'Category', thName: 'Name', thGrade: 'DOW Grade', thAction: 'Actions',
        emptyData: 'No records found.',
        modalAdminTitle: 'Add New Product (Text Specs)',
        lblUpId: 'Product ID (Unique)', lblUpCat: 'Category', lblUpZh: 'Name (ZH)', lblUpEn: 'Name (EN)', lblUpGr: 'Grade',
        txtBtnSubmit: 'Confirm Add Product',
        btnDelete: 'Delete',
        viewInfo: 'View Spec Info'
      }
    };

    function applyLanguage() {
      const t = I18N[currentLang];
      document.getElementById('langDisplay').innerText = t.langBtn;
      document.getElementById('brandTag').innerText = t.brandTag;
      document.getElementById('txtLoginBtn').innerText = t.txtLoginBtn;
      document.getElementById('txtLogoutBtn').innerText = t.txtLogoutBtn;
      document.getElementById('txtAdminTitle').innerText = t.txtAdminTitle;
      document.getElementById('txtAdminBtn').innerText = t.txtAdminBtn;
      
      document.getElementById('searchInput').placeholder = t.searchPh;
      document.getElementById('catAll').innerText = t.catAll;
      document.getElementById('catRubber').innerText = t.catRubber;
      document.getElementById('catPlastics').innerText = t.catPlastics;
      document.getElementById('catChem').innerText = t.catChem;
      document.getElementById('thCat').innerText = t.thCat;
      document.getElementById('thName').innerText = t.thName;
      document.getElementById('thGrade').innerText = t.thGrade;
      document.getElementById('thAction').innerText = t.thAction;
      
      document.getElementById('modalAdminTitle').innerText = t.modalAdminTitle;
      document.getElementById('lblUpId').innerText = t.lblUpId;
      document.getElementById('lblUpCat').innerText = t.lblUpCat;
      document.getElementById('lblUpZh').innerText = t.lblUpZh;
      document.getElementById('lblUpEn').innerText = t.lblUpEn;
      document.getElementById('lblUpGr').innerText = t.lblUpGr;
      document.getElementById('txtBtnSubmit').innerText = t.txtBtnSubmit;

      renderTable();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      applyLanguage();
    }

    // --- Firebase Auth ---
    function loginWithGooglePopup() {
      const provider = new firebase.auth.GoogleAuthProvider();
      const btn = document.getElementById('btnLogin');
      const loading = document.getElementById('authLoading');
      
      btn.classList.add('hidden');
      loading.classList.remove('hidden');

      auth.signInWithPopup(provider).catch(error => {
        console.error("登入失敗", error);
        btn.classList.remove('hidden');
        loading.classList.add('hidden');
        showToast('登入取消或發生錯誤', '❌');
      });
    }

    function logout() {
      auth.signOut();
    }

    auth.onAuthStateChanged((user) => {
      const btnLogin = document.getElementById('btnLogin');
      const userProfile = document.getElementById('userProfile');
      const adminPanel = document.getElementById('adminPanel');
      const authLoading = document.getElementById('authLoading');

      authLoading.classList.add('hidden');

      if (user) {
        currentUser = user;
        if (ADMIN_EMAILS.includes(user.email)) {
          isAdmin = true;
          document.getElementById('userName').innerText = user.displayName || user.email.split('@')[0];
          document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/150';
          
          btnLogin.classList.add('hidden');
          userProfile.classList.remove('hidden');
          adminPanel.classList.remove('hidden');
        } else {
          auth.signOut();
          isAdmin = false;
          alert(currentLang === 'zh' ? '拒絕存取：您的信箱不在管理員名單內。' : 'Access Denied.');
        }
      } else {
        currentUser = null;
        isAdmin = false;
        btnLogin.classList.add('hidden'); // 預設隱藏登入按鈕，點擊網頁特定區域或保留
        // 為了讓您隨時能點擊登入，我們讓登入按鈕顯示
        btnLogin.classList.remove('hidden');
        userProfile.classList.add('hidden');
        adminPanel.classList.add('hidden');
      }
      renderTable();
    });

    // --- DB Load & Auto Seed DOW EPDM ---
    function loadProductsFromDB() {
      db.collection('products').orderBy('createdAt', 'desc').onSnapshot(async snapshot => {
        PRODUCTS = [];
        snapshot.forEach(doc => {
          PRODUCTS.push({ id: doc.id, ...doc.data() });
        });

        // 如果資料庫完全沒有資料，自動把 DOW EPDM 牌號寫進去！
        if (PRODUCTS.length === 0) {
          for (let p of DEFAULT_DOW_PRODUCTS) {
            await db.collection('products').doc(p.id).set({
              category: p.category,
              nameZh: p.nameZh,
              nameEn: p.nameEn,
              grade: p.grade,
              descZh: p.descZh,
              descEn: p.descEn,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } else {
          renderTable();
        }
      }, error => {
        console.error("讀取失敗", error);
      });
    }

    loadProductsFromDB();
    applyLanguage();

    // --- Actions ---
    function showInfo(descZh, descEn, grade) {
      const text = currentLang === 'zh' ? `【DOW EPDM 牌號規格說明】\n牌號：${grade}\n特性：${descZh}` : `[DOW EPDM Spec]\nGrade: ${grade}\nDesc: ${descEn}`;
      alert(text);
    }

    function handleDelete(id) {
      if(!isAdmin) return;
      const confirmMsg = currentLang === 'zh' ? '確認刪除此產品資料？' : 'Confirm delete?';
      if(!confirm(confirmMsg)) return;
      
      db.collection('products').doc(id).delete().then(() => {
        showToast(currentLang === 'zh' ? '產品已刪除' : 'Deleted', '🗑️');
      });
    }

    // --- Render ---
    function setCat(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if(btn.getAttribute('data-c') === cat) {
          btn.className = "cat-btn px-3 py-1.5 rounded-lg bg-brand-700 text-white font-bold shadow";
        } else {
          btn.className = "cat-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors";
        }
      });
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const tbody = document.getElementById('tableBody');
      const t = I18N[currentLang];
      
      const filtered = PRODUCTS.filter(p => {
        if(currentCategory !== 'ALL' && p.category !== currentCategory) return false;
        if(q && !p.nameZh.toLowerCase().includes(q) && !p.nameEn.toLowerCase().includes(q) && !p.grade.toLowerCase().includes(q) && !p.id.toLowerCase().includes(q)) return false;
        return true;
      });

      if(filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">${t.emptyData}</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const catBadge = p.category === 'RUBBER' ? 'bg-sky-100 text-sky-800' :
                         p.category === 'PLASTICS' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800';
                         
        const adminDel = isAdmin ? `<button onclick="handleDelete('${p.id}')" class="px-2 py-1 bg-red-50 text-red-600 rounded text-xs hover:bg-red-100 ml-2 border border-red-200 transition-colors">${t.btnDelete}</button>` : '';
        const nameDisp = currentLang === 'zh' ? `${p.nameZh} <span class="text-xs text-slate-500 block">${p.nameEn}</span>` : `${p.nameEn} <span class="text-xs text-slate-500 block">${p.nameZh}</span>`;
        const descText = currentLang === 'zh' ? (p.descZh || '陶氏優質 EPDM 橡膠原料') : (p.descEn || 'DOW high quality EPDM polymer.');

        return `
          <tr class="hover:bg-brand-50/50 transition-colors border-b border-slate-50">
            <td class="py-4 px-4"><span class="px-2 py-1 rounded text-xs font-bold ${catBadge}">${p.category}</span></td>
            <td class="py-4 px-4">
              <strong class="text-slate-800">${nameDisp}</strong>
            </td>
            <td class="py-4 px-4 font-mono text-sm text-slate-700 font-bold">${p.grade}</td>
            <td class="py-4 px-4 text-center">
              <div class="flex justify-center items-center space-x-2">
                <button onclick="showInfo('${p.descZh || ''}', '${p.descEn || ''}', '${p.grade}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-brand-50 text-brand-700 border border-brand-200 hover:bg-brand-100 transition-all flex items-center">
                  <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> ${t.viewInfo}
                </button>
                ${adminDel}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // --- Admin Upload (Text Only) ---
    function openAdminModal() {
      if(!isAdmin) return;
      document.getElementById('adminModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    
    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    async function submitUpload() {
      if(!isAdmin) return;
      
      const id = document.getElementById('upId').value.trim();
      const nameZh = document.getElementById('upNameZh').value.trim();
      const grade = document.getElementById('upGrade').value.trim();
      const btnSubmit = document.getElementById('btnSubmitUpload');

      if(!id || !nameZh || !grade) {
        alert(currentLang === 'zh' ? '請填寫完整產品資訊！' : 'All fields are required!');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = currentLang === 'zh' ? '資料寫入中...' : 'Saving...';
      btnSubmit.classList.add('opacity-70');

      try {
        await db.collection('products').doc(id).set({
          category: document.getElementById('upCat').value,
          nameZh: nameZh,
          nameEn: document.getElementById('upNameEn').value || nameZh,
          grade: grade,
          descZh: '自定義新增規格資料',
          descEn: 'Custom added product specification',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showToast(currentLang === 'zh' ? `新增牌號 [${grade}] 成功` : `Added ${grade} successfully`, '✅');
        
        document.getElementById('upId').value = '';
        document.getElementById('upNameZh').value = '';
        document.getElementById('upNameEn').value = '';
        document.getElementById('upGrade').value = '';
        closeAdminModal();
        
      } catch (error) {
        console.error("Upload error", error);
        alert('儲存失敗，請檢查 Firestore 規則');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>${I18N[currentLang].txtBtnSubmit}</span>`;
        btnSubmit.classList.remove('opacity-70');
      }
    }

    function showToast(msg, icon) {
      const tb = document.getElementById('toastBox');
      document.getElementById('toastMessage').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      tb.classList.remove('translate-y-24', 'opacity-0');
      tb.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        tb.classList.remove('translate-y-0', 'opacity-100');
        tb.classList.add('translate-y-24', 'opacity-0');
      }, 3500);
    }
  </script>
</body>
</html>
