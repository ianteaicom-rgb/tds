<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>火星人的便當 · 財經導航</title>
  <style>
    :root {
      --bg-body: #0b0f17; --bg-sidebar: #111827; --bg-header: #131b2c;
      --bg-card: #162032; --bg-card-hover: #1e2c44; --border: #223048;
      --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }
    
    /* Top Bar */
    .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: var(--bg-header); border-bottom: 1px solid var(--border); z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .top-brand { font-weight: 700; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .menu-toggle { display: none; background: transparent; border: 1px solid var(--border); color: #fff; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    
    /* Auth Capsule */
    .top-auth-capsule { display: inline-flex; align-items: center; cursor: pointer; }
    .top-guest-block { background: #2563eb; color: #fff; border-radius: 20px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
    .user-profile-badge { display: none; align-items: center; gap: 8px; background: #162032; border: 1px solid var(--border); border-radius: 24px; padding: 3px 10px 3px 4px; }
    .user-avatar-img { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--accent); object-fit: cover; }
    
    /* Layout */
    .layout-wrapper { display: flex; width: 100%; margin-top: 52px; }
    aside.sidebar { width: 330px; background: var(--bg-sidebar); border-right: 1px solid var(--border); position: fixed; top: 52px; bottom: 0; left: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; z-index: 40; }
    main.content { margin-left: 330px; flex: 1; padding: 20px; }
    
    /* Honor Card */
    .honor-card { background: linear-gradient(135deg, #162032, #1a273e); border: 1px solid #2e3e5c; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .honor-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .honor-tag { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 3px 8px; border-radius: 6px; font-weight: 700; border: 1px solid rgba(56, 189, 248, 0.3); }
    .honor-action-toolbar { display: flex; gap: 6px; margin: 4px 0; }
    .honor-tool-btn { flex: 1; background: #111827; color: #94a3b8; border: 1px solid #223048; border-radius: 6px; padding: 6px 4px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
    .honor-tool-btn:hover { background: #1e293b; color: #38bdf8; border-color: #38bdf8; }
    .btn-checkin { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; width: 100%; }
    
    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 99; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #131b2c; border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 18px; color: #fff; }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 16px; font-weight: 700; color: #38bdf8; }
    .modal-close { background: transparent; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
    
    /* Tables */
    .table-scroll-wrap { width: 100%; overflow-x: auto; margin: 8px 0; }
    .lb-table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 12px; }
    .lb-table th, .lb-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); text-align: left; white-space: nowrap; }
    .btn-admin-act { padding: 3px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; border: none; font-weight: 600; }
    .btn-rep { background: rgba(16,185,129,0.2); color: #34d399; }
    .btn-kick { background: rgba(239,68,68,0.2); color: #f87171; }
    .btn-score { background: rgba(56,189,248,0.2); color: #38bdf8; border: 1px solid #38bdf8; }
    
    .ask-input { width: 100%; background: #0b0f17; border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 13px; color: #fff; outline: none; margin-bottom: 8px; }

    @media (max-width: 880px) {
      aside.sidebar { transform: translateX(-100%); transition: transform 0.25s ease; }
      aside.sidebar.open { transform: translateX(0); }
      main.content { margin-left: 0; padding: 14px; }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-brand">
      <button class="menu-toggle" onclick="window.toggleSidebar()">☰</button>
      <span>🍱 火星人的便當</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="honor-tool-btn" style="padding: 4px 10px; background:#d97706; color:#fff; border-color:#f59e0b;" onclick="window.openCommunityModal()">✍️ 新增文章</button>
      <div class="top-auth-capsule" onclick="window.openProfileModal()">
        <div class="top-guest-block" id="topGuestBlock">👤 登入</div>
        <div class="user-profile-badge" id="userBadge">
          <img src="" id="topUserAvatar" class="user-avatar-img">
          <span id="topUserName" style="font-size:12px; font-weight:600;"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="layout-wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="honor-card">
        <div class="honor-header">
          <span class="honor-tag">🎖️ 榮譽殿堂</span>
          <span style="color:#a855f7; font-weight:700;">⏱️ 停留: <span id="sidebarDwellClock">00:00</span></span>
        </div>
        <div class="honor-action-toolbar">
          <button class="honor-tool-btn" onclick="window.openExpGuideModal()">📖 積分攻略</button>
          <button class="honor-tool-btn" onclick="window.openLeaderboardModal()">🏆 排行榜</button>
        </div>
        <div style="font-size: 12px; margin-top: 8px;">
          <div>目前等級：<span id="honorLvlNum" style="color:#38bdf8; font-weight:bold;">Lv.01</span></div>
          <div style="margin-top:4px;">EXP: <span id="honorExpCur">0</span></div>
          <div style="margin-top:4px; font-size:11px; color:#fbbf24;">🔥 連續登入: <b id="streakDaysCount">1</b> 天</div>
        </div>
        <button class="btn-checkin" style="margin-top: 10px;" onclick="window.dailyCheckIn()">📅 每日簽到 (+30)</button>
      </div>
    </aside>

    <main class="content">
      <h2 style="margin-bottom: 16px;">歡迎來到火星人的便當導航</h2>
      <p style="color: var(--text-sub); font-size: 14px;">點擊左側「🏆 排行榜」或右上方頭像進行版主積分測試。</p>
    </main>
  </div>

  <!-- 排行榜 Modal -->
  <div class="modal-overlay" id="leaderboardModal" onclick="window.closeLeaderboardModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">🏆 觀賞者全體便當排行榜</div>
        <button class="modal-close" onclick="window.closeLeaderboardModal()">✕</button>
      </div>
      <div class="table-scroll-wrap">
        <table class="lb-table">
          <thead>
            <tr><th>名次</th><th>投資人</th><th>累積 EXP</th><th id="thAdminAction" style="display:none;">版主操作</th></tr>
          </thead>
          <tbody id="lbTableBody">
            <tr><td colspan="4" style="text-align:center;">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 版主調分 Modal -->
  <div class="modal-overlay" id="adjustExpModal" onclick="window.closeAdjustExpModal(event)">
    <div class="modal-box" style="max-width: 400px;" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">🎯 調整玩家分數</div>
        <button class="modal-close" onclick="window.closeAdjustExpModal()">✕</button>
      </div>
      <div id="adjustExpTargetName" style="color:#38bdf8; font-weight:bold; margin-bottom: 12px; font-size: 14px;"></div>
      <div style="display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
          <button class="honor-tool-btn" onclick="document.getElementById('adjustExpInput').value='+50'">+50 (7天連登)</button>
          <button class="honor-tool-btn" onclick="document.getElementById('adjustExpInput').value='+100'">+100</button>
          <button class="honor-tool-btn" onclick="document.getElementById('adjustExpInput').value='-100'">-100 (扣除)</button>
      </div>
      <input type="text" id="adjustExpInput" class="ask-input" placeholder="輸入增減 (如 +50) 或 絕對分數 (如 50000)">
      <button class="btn-checkin" onclick="window.submitAdjustExp()">確認修改</button>
    </div>
  </div>

  <!-- 個人資料與版主自我修復 Modal -->
  <div class="modal-overlay" id="profileModal" onclick="window.closeProfileModal(event)">
    <div class="modal-box" style="max-width: 450px;" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">👤 個人資料與設定</div>
        <button class="modal-close" onclick="window.closeProfileModal()">✕</button>
      </div>
      
      <div id="adminRescueBox" style="background:#0b0f17; border:1px solid #f59e0b; border-radius:8px; padding:12px; margin-top:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:13px; font-weight:700; color:#f59e0b;">👑 版主 Mars 積分修復與設定</span>
          <button type="button" onclick="window.claimMarsAdmin()" style="background:transparent; border:none; color:#38bdf8; font-size:12px; cursor:pointer; text-decoration:underline;">強制啟用版主權限</button>
        </div>
        <input type="number" id="manualExpInput" class="ask-input" placeholder="輸入要設定的總 EXP (如 3000000)">
        <button class="btn-checkin" style="background:#d97706;" onclick="window.manualSetMyExp()">修復分數</button>
      </div>
      <button class="btn-checkin" style="background:#2563eb; margin-top: 12px;" onclick="window.loginWithGoogle()" id="loginBtn">登入 Google 帳號</button>
    </div>
  </div>

  <!-- 新增文章 Modal -->
  <div class="modal-overlay" id="communityModal" onclick="window.closeCommunityModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">✍️ 發表火星觀點文章</div>
        <button class="modal-close" onclick="window.closeCommunityModal()">✕</button>
      </div>
      <p style="font-size:13px; margin-bottom: 12px;">發表您的見解，即可獲得 +150 EXP！</p>
      <input type="text" class="ask-input" placeholder="文章標題">
      <textarea class="ask-input" placeholder="內容..." style="height: 100px; resize: none;"></textarea>
      <button class="btn-checkin" onclick="window.submitPost()">🚀 送出文章</button>
    </div>
  </div>

  <div class="modal-overlay" id="expGuideModal" onclick="window.closeExpGuideModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header"><div class="modal-title">📖 積分攻略</div><button class="modal-close" onclick="window.closeExpGuideModal()">✕</button></div>
      <p>1. 每日簽到 +30 EXP<br>2. 發表文章 +150 EXP<br>3. 連續登入 7 天 +50 EXP (由版主發放)</p>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtz0DB1sXsW5bGQuES9Iwn-jADSmLkTgk",
      authDomain: "money-hub-35c75.firebaseapp.com",
      projectId: "money-hub-35c75",
      storageBucket: "money-hub-35c75.firebasestorage.app",
      messagingSenderId: "1034621666956",
      appId: "1:1034621666956:web:6ebd3498497739eb689da9"
    };

    let app, auth, db, isFirebaseReady = false;
    try {
      app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); isFirebaseReady = true;
    } catch(e) { console.warn("Firebase Init Error:", e); }

    window.currentUser = null;
    window.localUserData = JSON.parse(localStorage.getItem('mars_viewer_v6')) || {
      uid: 'guest', displayName: '股市投資人', photoURL: "https://api.dicebear.com/7.x/bottts/svg?seed=MarsGuest",
      totalExp: 0, isAdmin: false, streakDays: 1
    };

    window.saveLocal = function() { localStorage.setItem('mars_viewer_v6', JSON.stringify(window.localUserData)); }

    // ====== UI Toggles & Modals (Global Binding) ======
    window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('open');
    window.openProfileModal = () => document.getElementById('profileModal').classList.add('show');
    window.closeProfileModal = () => document.getElementById('profileModal').classList.remove('show');
    window.openCommunityModal = () => document.getElementById('communityModal').classList.add('show');
    window.closeCommunityModal = () => document.getElementById('communityModal').classList.remove('show');
    window.openExpGuideModal = () => document.getElementById('expGuideModal').classList.add('show');
    window.closeExpGuideModal = () => document.getElementById('expGuideModal').classList.remove('show');
    window.closeLeaderboardModal = () => document.getElementById('leaderboardModal').classList.remove('show');
    window.closeAdjustExpModal = () => document.getElementById('adjustExpModal').classList.remove('show');

    // ====== Feature: Update UI ======
    window.updateUI = function() {
      document.getElementById('topUserName').innerText = window.localUserData.displayName;
      document.getElementById('topUserAvatar').src = window.localUserData.photoURL;
      document.getElementById('honorExpCur').innerText = window.localUserData.totalExp.toLocaleString();
      document.getElementById('streakDaysCount').innerText = window.localUserData.streakDays || 1;
      
      if(window.currentUser) {
        document.getElementById('topGuestBlock').style.display = 'none';
        document.getElementById('userBadge').style.display = 'flex';
        document.getElementById('loginBtn').style.display = 'none';
      }
    };

    // ====== Feature: Login ======
    window.loginWithGoogle = async function() {
      if(!isFirebaseReady) return alert("Firebase 尚未連線");
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch(e) { alert(e.message); }
    };

    onAuthStateChanged(auth, async (user) => {
      if(user) {
        window.currentUser = user;
        const userRef = doc(db, 'users', user.uid);
        const snap = await getDoc(userRef);
        if(snap.exists()) {
          const d = snap.data();
          window.localUserData = { ...window.localUserData, uid: user.uid, displayName: d.displayName, totalExp: d.totalExp || 0, isAdmin: d.isAdmin || false };
        } else {
          window.localUserData = { uid: user.uid, displayName: user.displayName, photoURL: user.photoURL, totalExp: window.localUserData.totalExp, isAdmin: false };
          await setDoc(userRef, window.localUserData);
        }
        window.saveLocal();
        window.updateUI();
        window.closeProfileModal();
      }
    });

    // ====== Feature: Board & Adjust EXP ======
    window.openLeaderboardModal = async function() {
      document.getElementById('leaderboardModal').classList.add('show');
      const tbody = document.getElementById('lbTableBody');
      const thAdmin = document.getElementById('thAdminAction');
      
      if(!isFirebaseReady || !db) { tbody.innerHTML = "<tr><td colspan='4'>尚未連線</td></tr>"; return; }
      
      thAdmin.style
